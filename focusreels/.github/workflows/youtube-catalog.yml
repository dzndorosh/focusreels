name: YouTube catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run catalog:youtube:collect
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Publish catalog to Pages
        if: github.event_name == 'workflow_dispatch' || vars.YOUTUBE_CATALOG_AUTO_PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - run: npm test
      - uses: actions/upload-artifact@v4
        with: { name: youtube-catalog, path: public/catalog }
  deploy:
    if: github.event_name == 'workflow_dispatch' && vars.YOUTUBE_CATALOG_AUTO_PUBLISH == 'true'
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
